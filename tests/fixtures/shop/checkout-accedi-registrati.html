<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cassa | Passo Svelto</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="shop.css">
</head>
<!-- Account gate fixture "c20": a combined "Accedi o registrati" box (email and password, submitted with "Continua")
     beside the delivery form. A login-or-register box is a login box: its password is a returning customer's, and
     the delivery form is the way in for everyone else, so this is no gate (login_required false). -->
<body>
  <header class="site-header">
    <div class="bar"><a class="logo" href="index.html">Passo Svelto</a> <a href="cart.html">Torna al carrello</a></div>
  </header>
  <main class="wrap" id="main">
    <h1>Cassa</h1>
    <div class="layout">
      <section class="login-box">
        <form method="post" action="/account/accesso">
          <h2>Accedi o registrati</h2>
          <label>Email <input type="email" name="login_email"></label>
          <label>Password <input type="password" name="login_password" required></label>
          <button class="btn btn-secondary" type="submit">Continua</button>
        </form>
      </section>
      <section class="delivery">
        <h2>Dati di spedizione</h2>
        <form method="post" action="/cassa/spedizione">
          <label>Email <input type="email" name="email" autocomplete="email" required></label>
          <label>Nome <input name="nome" autocomplete="given-name" required></label>
          <label>Indirizzo <input name="indirizzo" autocomplete="address-line1" required></label>
          <label>CAP <input name="cap" autocomplete="postal-code" required></label>
          <label>Città <input name="citta" autocomplete="address-level2" required></label>
          <button class="btn btn-primary" type="submit">Continua</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
